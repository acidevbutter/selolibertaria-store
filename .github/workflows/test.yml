name: Test
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # backend/ is a submodule in a separate (likely private) repo -- the
      # default GITHUB_TOKEN has no cross-repo access to clone it, so this is
      # a best-effort init kept off the critical path (continue-on-error)
      # rather than part of the main checkout, which would otherwise fail
      # this whole job -- including yarn lint/test, which don't need
      # backend/ at all -- the moment the submodule can't be fetched. Give
      # the token cross-repo access (or a PAT scoped to
      # acidevbutter/selolibertaria_backend) once this workflow needs to
      # build/test the backend too.
      - name: Init backend/ submodule (best-effort)
        continue-on-error: true
        run: git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn lint

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
