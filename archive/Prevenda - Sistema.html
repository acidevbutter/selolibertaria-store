document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"fe82a689-d478-423b-8f11-a819312979be\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n@font-face{font-family:\"DCCAsh\";src:url(\"9f5ec360-1b45-46ee-a3f9-7c368dab08ac\") format(\"opentype\");font-display:swap}\n@font-face{font-family:\"Fertigo\";src:url(\"ea3db8ca-e138-432f-af0c-86dd59b56ec5\") format(\"opentype\");font-display:swap}\nbody{margin:0;background:#F7F4EF;font-family:\"Fertigo\",\"Iowan Old Style\",serif;color:#0B0B0B}\na{color:#7A1E22;text-decoration:none}\na:hover{color:#B3282E}\ninput,button{font-family:inherit}\ninput[type=date]::-webkit-calendar-picker-indicator{opacity:.55}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:1360px;margin:0 auto;box-sizing:border-box;background:#F7F4EF\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:#0B0B0B;color:#F7F4EF\">\n    <span style=\"font-size:10px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:rgba(247,244,239,.55)\">Protótipo · Pré-venda<\u002Fspan>\n    <div style=\"display:flex;gap:8px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ goAssistente }}\" style=\"height:34px;padding:0 14px;border:1px solid rgba(247,244,239,.3);background:{{ tabA }};color:{{ tabAFg }};font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;cursor:pointer\">Assistente<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goLista }}\" style=\"height:34px;padding:0 14px;border:1px solid rgba(247,244,239,.3);background:{{ tabB }};color:{{ tabBFg }};font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;cursor:pointer\">Menu Pré-vendas<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goLoja }}\" style=\"height:34px;padding:0 14px;border:1px solid rgba(247,244,239,.3);background:{{ tabC }};color:{{ tabCFg }};font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;cursor:pointer\">Modal na loja<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isAssistente }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-screen-label=\"Admin — assistente de pré-venda\" style=\"display:flex;min-height:840px;align-items:stretch\">\n\n    <div style=\"flex:none;width:268px;background:#0B0B0B;color:#F7F4EF;padding:28px 0;display:flex;flex-direction:column\">\n      <div style=\"padding:0 26px 22px\">\n        <p style=\"margin:0;font-size:10px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:rgba(247,244,239,.5)\">Primeiro acesso<\u002Fp>\n        <p style=\"margin:8px 0 0;font-size:22px;font-weight:900;line-height:1.05;text-transform:uppercase;letter-spacing:-.03em\">Abrir a pré-venda<\u002Fp>\n        <p style=\"margin:10px 0 0;font-size:13px;line-height:1.6;color:rgba(247,244,239,.6)\">little fish, big fish · Natália Nolli Sasso<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <sc-for list=\"{{ trilha }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div sc-camel-on-click=\"{{ s.go }}\" style=\"display:flex;gap:14px;padding:14px 26px;cursor:pointer;background:{{ s.bg }};color:{{ s.fg }};border-left:4px solid {{ s.bar }}\">\n            <span style=\"flex:none;font-family:'DCCAsh',serif;font-size:16px;color:{{ s.num }}\">{{ s.n }}<\u002Fspan>\n            <div>\n              <div style=\"font-size:14px;font-weight:900\">{{ s.label }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:{{ s.hintColor }}\">{{ s.hint }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;padding:22px 26px 0\">\n        <div style=\"height:1px;background:rgba(247,244,239,.18);margin-bottom:16px\"><\u002Fdiv>\n        <p style=\"margin:0 0 14px;font-size:12px;line-height:1.6;color:rgba(247,244,239,.6)\">Rascunho salvo. Nada vai ao ar antes do passo 4.<\u002Fp>\n        <span style=\"font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:rgba(247,244,239,.45);cursor:pointer\">Configurar depois<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.5)\">\n        <span>Pré-vendas<\u002Fspan><span>/<\u002Fspan><span>Nova<\u002Fspan><span>/<\u002Fspan><span style=\"color:#7A1E22\">{{ stepLabel }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:40rem\">\n          <h2 style=\"margin:0;font-size:34px;line-height:1;font-weight:900;letter-spacing:-.04em;text-transform:uppercase\">Quando o livro estreia<\u002Fh2>\n          <p style=\"margin:0;font-size:15px;line-height:1.65;color:rgba(11,11,11,.62)\">A pré-venda começa hoje e termina nessa data. É nesse dia que a cobrança de quem reservou acontece.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n          <label style=\"display:flex;flex-direction:column;gap:8px;min-width:260px\">\n            <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.6)\">Data da estreia<\u002Fspan>\n            <input type=\"date\" value=\"{{ launchDate }}\" sc-camel-on-change=\"{{ onDate }}\" style=\"height:52px;box-sizing:border-box;padding:0 14px;background:#FFFFFF;border:1px solid rgba(11,11,11,.3);border-radius:0;font-size:16px;color:#0B0B0B\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;width:170px\">\n            <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.6)\">Hora<\u002Fspan>\n            <input type=\"time\" value=\"{{ launchTime }}\" sc-camel-on-change=\"{{ onTime }}\" style=\"height:52px;box-sizing:border-box;padding:0 14px;background:#FFFFFF;border:1px solid rgba(11,11,11,.3);border-radius:0;font-size:16px;color:#0B0B0B\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(11,11,11,.12);background:#FFFFFF;padding:20px;display:flex;flex-direction:column;gap:12px;max-width:44rem\">\n          <p style=\"margin:0;font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:#7A1E22\">A janela fica assim<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-family:'DCCAsh',serif;font-size:22px\">hoje<\u002Fspan>\n              <span style=\"font-size:12px;color:rgba(11,11,11,.55)\">reservas abrem<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:60px;height:1px;background:rgba(11,11,11,.2)\"><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-family:'DCCAsh',serif;font-size:22px;color:#7A1E22\">{{ diasRestantes }} dias<\u002Fspan>\n              <span style=\"font-size:12px;color:rgba(11,11,11,.55)\">modal a cada {{ intervaloTexto }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:60px;height:1px;background:rgba(11,11,11,.2)\"><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-family:'DCCAsh',serif;font-size:22px\">{{ dataCurta }}<\u002Fspan>\n              <span style=\"font-size:12px;color:rgba(11,11,11,.55)\">estreia e cobrança<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:40rem\">\n          <h2 style=\"margin:0;font-size:34px;line-height:1;font-weight:900;letter-spacing:-.04em;text-transform:uppercase\">Quanto custa na pré-venda<\u002Fh2>\n          <p style=\"margin:0;font-size:15px;line-height:1.65;color:rgba(11,11,11,.62)\">Quem reserva agora paga esse valor. O cartão é autorizado na reserva e cobrado na estreia.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.6)\">Preço cheio<\u002Fspan>\n            <div style=\"display:flex;align-items:center;height:52px;box-sizing:border-box;padding:0 14px;background:#D8D0C4;border:1px solid rgba(11,11,11,.2);font-family:'DCCAsh',serif;font-size:18px\">{{ precoCheioTexto }}<\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.6)\">Preço de pré-venda<\u002Fspan>\n            <input type=\"number\" step=\"1\" value=\"{{ presalePrice }}\" sc-camel-on-change=\"{{ onPrice }}\" style=\"width:190px;height:52px;box-sizing:border-box;padding:0 14px;background:#FFFFFF;border:1px solid rgba(11,11,11,.3);border-radius:0;font-family:'DCCAsh',serif;font-size:18px;color:#0B0B0B\">\n          <\u002Flabel>\n          <div style=\"display:flex;gap:8px;padding-bottom:2px\">\n            <sc-for list=\"{{ atalhos }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ a.go }}\" style=\"height:52px;padding:0 16px;background:{{ a.bg }};color:{{ a.fg }};border:1px solid rgba(11,11,11,.3);font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;cursor:pointer\">{{ a.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(11,11,11,.12);background:#FFFFFF;padding:20px;display:flex;gap:40px;flex-wrap:wrap;max-width:44rem\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.55)\">Desconto<\u002Fspan>\n            <span style=\"font-family:'DCCAsh',serif;font-size:30px;color:#7A1E22\">{{ descontoTexto }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.55)\">O cliente economiza<\u002Fspan>\n            <span style=\"font-family:'DCCAsh',serif;font-size:30px\">{{ economiaTexto }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.55)\">Cobrança<\u002Fspan>\n            <span style=\"font-family:'DCCAsh',serif;font-size:30px\">{{ dataCurta }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(122,30,34,.4);background:rgba(122,30,34,.06);padding:16px 18px;max-width:44rem\">\n          <p style=\"margin:0;font-size:14px;line-height:1.7;color:#7A1E22\">Nenhum dinheiro entra antes da estreia. Na data, o sistema cobra todas as reservas de uma vez e envia o e-mail de confirmação. Se um cartão falhar, a reserva fica marcada aqui com link para o cliente atualizar.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep3 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:40rem\">\n          <h2 style=\"margin:0;font-size:34px;line-height:1;font-weight:900;letter-spacing:-.04em;text-transform:uppercase\">Como aparece no site<\u002Fh2>\n          <p style=\"margin:0;font-size:15px;line-height:1.65;color:rgba(11,11,11,.62)\">O aviso abre sozinho para quem está navegando. A prévia à direita é exatamente o que o visitante vê.<\u002Fp>\n        <\u002Fdiv>\n        <label style=\"display:flex;flex-direction:column;gap:8px;max-width:44rem\">\n          <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.6)\">Título do aviso<\u002Fspan>\n          <input type=\"text\" value=\"{{ modalTitle }}\" sc-camel-on-change=\"{{ onTitle }}\" style=\"height:52px;box-sizing:border-box;padding:0 14px;background:#FFFFFF;border:1px solid rgba(11,11,11,.3);border-radius:0;font-size:16px;color:#0B0B0B\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px;max-width:44rem\">\n          <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.6)\">Frase<\u002Fspan>\n          <input type=\"text\" value=\"{{ modalBody }}\" sc-camel-on-change=\"{{ onBody }}\" style=\"height:52px;box-sizing:border-box;padding:0 14px;background:#FFFFFF;border:1px solid rgba(11,11,11,.3);border-radius:0;font-size:16px;color:#0B0B0B\">\n        <\u002Flabel>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.6)\">Aparece de novo a cada<\u002Fspan>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ intervalos }}\" as=\"i\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ i.go }}\" style=\"height:48px;padding:0 18px;background:{{ i.bg }};color:{{ i.fg }};border:1px solid rgba(11,11,11,.3);font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;cursor:pointer\">{{ i.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;line-height:1.6;color:rgba(11,11,11,.55);max-width:44rem\">Contado por navegador. Fechar conta como visto. Não aparece no carrinho, nem para quem já reservou.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep4 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:40rem\">\n          <h2 style=\"margin:0;font-size:34px;line-height:1;font-weight:900;letter-spacing:-.04em;text-transform:uppercase\">Revisar e publicar<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(11,11,11,.12);background:#FFFFFF;padding:24px;max-width:46rem\">\n          <p style=\"margin:0;font-size:19px;line-height:1.6\">{{ resumoFrase }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;max-width:46rem\">\n          <span style=\"font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:rgba(11,11,11,.6)\">O que passa a valer<\u002Fspan>\n          <div style=\"display:flex;gap:12px;padding:14px 16px;border:1px solid rgba(11,11,11,.12);background:#FFFFFF\"><span style=\"font-family:'DCCAsh',serif;color:#7A1E22\">01<\u002Fspan><span style=\"font-size:14px;line-height:1.6\">Reservas abrem agora e o aviso entra no ar no site.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;padding:14px 16px;border:1px solid rgba(11,11,11,.12);background:#FFFFFF\"><span style=\"font-family:'DCCAsh',serif;color:#7A1E22\">02<\u002Fspan><span style=\"font-size:14px;line-height:1.6\">Em {{ dataLonga }} o sistema cobra todas as reservas e envia os e-mails.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;padding:14px 16px;border:1px solid rgba(11,11,11,.12);background:#FFFFFF\"><span style=\"font-family:'DCCAsh',serif;color:#7A1E22\">03<\u002Fspan><span style=\"font-size:14px;line-height:1.6\">Depois da estreia o produto continua na loja por {{ precoCheioTexto }}, sem aviso.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;padding:14px 16px;border:1px solid rgba(122,30,34,.4);background:rgba(122,30,34,.06)\"><span style=\"font-family:'DCCAsh',serif;color:#7A1E22\">04<\u002Fspan><span style=\"font-size:14px;line-height:1.6;color:#7A1E22\">Assim que existir uma reserva, esta pré-venda e o produto não podem mais ser apagados — só encerrados.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ publicado }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px solid rgba(11,11,11,.2);background:#D8D0C4;padding:18px 20px;max-width:46rem;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n            <p style=\"margin:0;font-size:15px;color:#7A1E22;font-weight:900\">No ar desde agora. A primeira reserva pode chegar a qualquer momento.<\u002Fp>\n            <button type=\"button\" sc-camel-on-click=\"{{ goLista }}\" style=\"height:44px;padding:0 18px;background:#0B0B0B;color:#F7F4EF;border:none;font-size:11px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;cursor:pointer\">Ver a pré-venda<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"margin-top:auto;display:flex;gap:10px;justify-content:flex-end;padding-top:24px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ voltar }}\" style=\"height:48px;padding:0 20px;background:#FFFFFF;border:1px solid rgba(11,11,11,.35);font-size:11px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;cursor:pointer\">Voltar<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ avancar }}\" style=\"height:48px;padding:0 24px;background:#7A1E22;color:#F7F4EF;border:none;font-size:11px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;cursor:pointer\">{{ avancarLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:none;width:340px;border-left:1px solid rgba(11,11,11,.18);background:#FFFFFF;padding:28px 24px;display:flex;flex-direction:column;gap:18px\">\n      <p style=\"margin:0;font-size:10px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:#7A1E22\">{{ previaTitulo }}<\u002Fp>\n\n      <sc-if value=\"{{ previaCartao }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border:1px solid rgba(11,11,11,.14);background:#F7F4EF;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <img src=\"971c6eb6-c124-45a4-aed9-84cd653b80f9\" alt=\"Capa de little fish, big fish\" style=\"width:100%;height:190px;object-fit:cover;display:block;background:#0B0B0B\">\n          <p style=\"margin:0;font-size:20px;font-weight:900;line-height:1.05;text-transform:uppercase;letter-spacing:-.03em\">little fish, big fish<\u002Fp>\n          <div style=\"display:flex;align-items:baseline;gap:10px\">\n            <span style=\"font-family:'DCCAsh',serif;font-size:18px;color:rgba(11,11,11,.45);text-decoration:line-through\">{{ precoCheioTexto }}<\u002Fspan>\n            <span style=\"font-family:'DCCAsh',serif;font-size:28px;color:#7A1E22\">{{ precoPrevendaTexto }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"align-self:flex-start;display:inline-flex;align-items:center;height:24px;padding:0 10px;background:#7A1E22;color:#F7F4EF;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase\">Pré-venda · {{ descontoTexto }}<\u002Fspan>\n          <p style=\"margin:0;font-size:13px;line-height:1.6;color:rgba(11,11,11,.6)\">Cobrado em {{ dataLonga }}, quando o livro estreia.<\u002Fp>\n          <div style=\"display:flex;align-items:center;justify-content:center;height:48px;background:#0B0B0B;color:#F7F4EF;font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase\">Reservar<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ previaModal }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px solid rgba(11,11,11,.18);background:#0B0B0B;padding:26px 22px;display:flex;flex-direction:column;gap:16px\">\n          <span style=\"font-size:10px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:#F2891E\">Pré-venda<\u002Fspan>\n          <p style=\"margin:0;font-family:'Fertigo',serif;font-size:30px;line-height:.95;font-weight:900;letter-spacing:-.03em;color:#F2891E\">{{ modalTitle }}<\u002Fp>\n          <p style=\"margin:0;font-size:14px;line-height:1.7;color:rgba(247,244,239,.75)\">{{ modalBody }}<\u002Fp>\n          <div style=\"display:flex;align-items:baseline;gap:10px\">\n            <span style=\"font-family:'DCCAsh',serif;font-size:16px;color:rgba(247,244,239,.45);text-decoration:line-through\">{{ precoCheioTexto }}<\u002Fspan>\n            <span style=\"font-family:'DCCAsh',serif;font-size:26px;color:#F7F4EF\">{{ precoPrevendaTexto }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:center;height:46px;background:#F2891E;color:#0B0B0B;font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase\">Reservar meu exemplar<\u002Fdiv>\n          <p style=\"margin:0;font-size:11px;letter-spacing:.06em;color:rgba(247,244,239,.45);text-align:center\">Agora não<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;line-height:1.6;color:rgba(11,11,11,.55)\">Reaparece {{ intervaloFrase }} para quem não reservou.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLista }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Admin — menu Pré-vendas\" style=\"display:flex;min-height:840px;align-items:stretch\">\n    <div style=\"flex:none;width:268px;background:#0B0B0B;color:#F7F4EF;padding:28px 0;display:flex;flex-direction:column;gap:6px\">\n      <p style=\"margin:0 26px 14px;font-size:9px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:#B3282E\">Loja<\u002Fp>\n      <div style=\"padding:9px 26px;font-size:14px;color:rgba(247,244,239,.65)\">Produtos<\u002Fdiv>\n      <div style=\"padding:9px 26px;font-size:14px;color:rgba(247,244,239,.65)\">Pedidos<\u002Fdiv>\n      <div style=\"padding:9px 26px;font-size:14px;color:rgba(247,244,239,.65)\">Promoções<\u002Fdiv>\n      <div style=\"padding:9px 26px;font-size:14px;font-weight:900;background:#F7F4EF;color:#0B0B0B\">Pré-vendas<\u002Fdiv>\n      <div style=\"padding:9px 26px;font-size:14px;color:rgba(247,244,239,.65)\">Clientes<\u002Fdiv>\n      <p style=\"margin:22px 26px 14px;font-size:9px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:#B3282E\">Site<\u002Fp>\n      <div style=\"padding:9px 26px;font-size:14px;color:rgba(247,244,239,.65)\">Páginas<\u002Fdiv>\n      <div style=\"padding:9px 26px;font-size:14px;color:rgba(247,244,239,.65)\">Mídia<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <p style=\"margin:0;font-size:10px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:#7A1E22\">Menu novo<\u002Fp>\n          <h2 style=\"margin:0;font-size:44px;line-height:.92;font-weight:900;letter-spacing:-.045em;text-transform:uppercase\">Pré-vendas<\u002Fh2>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ goAssistente }}\" style=\"height:48px;padding:0 22px;background:#0B0B0B;color:#F7F4EF;border:none;font-size:11px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;cursor:pointer\">Nova pré-venda<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <div style=\"flex:1;min-width:220px;display:flex;align-items:center;height:52px;padding:0 14px;background:#FFFFFF;border:1px solid rgba(11,11,11,.3);font-size:14px;color:rgba(11,11,11,.45)\">Buscar pré-venda…<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;height:52px;padding:0 14px;background:#FFFFFF;border:1px solid rgba(11,11,11,.3);font-size:11px;font-weight:900;letter-spacing:.24em;text-transform:uppercase\">Todos os estados<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid rgba(11,11,11,.12);background:#FFFFFF\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,2fr) 110px 110px 130px 130px;gap:12px;padding:10px 16px;background:#D8D0C4;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:rgba(11,11,11,.7)\">\n          <span>Produto<\u002Fspan><span>Estado<\u002Fspan><span>Reservas<\u002Fspan><span>A cobrar<\u002Fspan><span>Estreia<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ toggleDetalhe }}\" style=\"display:grid;grid-template-columns:minmax(0,2fr) 110px 110px 130px 130px;gap:12px;align-items:center;padding:16px;border-bottom:1px solid rgba(11,11,11,.1);cursor:pointer\">\n          <span style=\"font-size:16px;font-weight:900\">little fish, big fish<\u002Fspan>\n          <span style=\"justify-self:start;display:inline-flex;align-items:center;height:24px;padding:0 10px;background:#0B0B0B;color:#F7F4EF;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase\">No ar<\u002Fspan>\n          <span style=\"font-family:'DCCAsh',serif;font-size:18px\">18<\u002Fspan>\n          <span style=\"font-family:'DCCAsh',serif;font-size:18px;color:#7A1E22\">{{ totalACobrar }}<\u002Fspan>\n          <span style=\"font-family:'DCCAsh',serif;font-size:16px\">{{ dataCurta }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ detalheAberto }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:20px 16px;background:#F7F4EF;border-bottom:1px solid rgba(11,11,11,.1);display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:flex;gap:36px;flex-wrap:wrap\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:rgba(11,11,11,.55)\">Reservado<\u002Fspan><span style=\"font-family:'DCCAsh',serif;font-size:22px\">16<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:rgba(11,11,11,.55)\">Cartão a confirmar<\u002Fspan><span style=\"font-family:'DCCAsh',serif;font-size:22px;color:#7A1E22\">2<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:rgba(11,11,11,.55)\">Preço de pré-venda<\u002Fspan><span style=\"font-family:'DCCAsh',serif;font-size:22px\">{{ precoPrevendaTexto }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid rgba(122,30,34,.4);background:rgba(122,30,34,.06);padding:16px 18px\">\n              <p style=\"margin:0;font-size:14px;line-height:1.7;color:#7A1E22\">Esta pré-venda tem 18 reservas — por isso ela e o produto <strong>little fish, big fish<\u002Fstrong> não podem ser apagados. Para tirar do ar sem prejudicar quem reservou, use <strong>Encerrar pré-venda<\u002Fstrong>: as reservas seguem e serão cobradas na estreia.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n              <span style=\"display:inline-flex;align-items:center;height:44px;padding:0 18px;background:#FFFFFF;border:1px solid rgba(11,11,11,.3);font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;cursor:pointer\">Ver reservas<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;height:44px;padding:0 18px;background:#FFFFFF;border:1px solid rgba(11,11,11,.3);font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;cursor:pointer\">Editar aviso<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;height:44px;padding:0 18px;background:#7A1E22;color:#F7F4EF;font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;cursor:pointer\">Encerrar pré-venda<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;height:44px;padding:0 18px;border:1px solid rgba(11,11,11,.12);color:rgba(11,11,11,.35);font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase\">Apagar · indisponível<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"padding:16px;font-size:14px;color:rgba(11,11,11,.55)\">Nenhuma outra pré-venda. A próxima abre quando você marcar uma data de estreia em um produto.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLoja }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Loja — modal de pré-venda\" style=\"position:relative;min-height:840px;background:#0B0B0B;padding:56px 48px;display:flex;flex-direction:column;gap:28px;overflow:hidden\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:20px;border-bottom:1px solid rgba(247,244,239,.12)\">\n      <span style=\"font-size:14px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:#F7F4EF\">Selo Libertária<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:rgba(247,244,239,.5)\">Catálogo · Sobre · Carrinho<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px;max-width:620px\">\n      <h2 style=\"margin:0;font-size:56px;line-height:.9;font-weight:900;letter-spacing:-.04em;color:#F7F4EF\">Catálogo<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.8;color:rgba(247,244,239,.6)\">Página qualquer da loja. O aviso de pré-venda abre por cima, uma vez a cada {{ intervaloTexto }}, por navegador.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;padding-top:8px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ simularVisita }}\" style=\"height:46px;padding:0 20px;background:#F2891E;color:#0B0B0B;border:none;font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;cursor:pointer\">Simular nova visita<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ avancarTempo }}\" style=\"height:46px;padding:0 20px;background:transparent;color:#F7F4EF;border:1px solid rgba(247,244,239,.35);font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;cursor:pointer\">Avançar {{ intervaloTexto }}<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;line-height:1.7;color:rgba(247,244,239,.45)\">{{ estadoModal }}<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ modalAberto }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;inset:0;background:rgba(11,11,11,.82);display:flex;align-items:center;justify-content:center;padding:32px\">\n        <div style=\"width:100%;max-width:560px;background:#0B0B0B;border:1px solid rgba(247,244,239,.25);padding:40px;display:flex;flex-direction:column;gap:20px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n            <span style=\"font-size:10px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#F2891E\">Pré-venda · até {{ dataCurta }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ fecharModal }}\" style=\"background:none;border:none;color:rgba(247,244,239,.6);font-size:18px;cursor:pointer;padding:0\">×<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-family:'Fertigo',serif;font-size:46px;line-height:.9;font-weight:900;letter-spacing:-.04em;color:#F2891E\">{{ modalTitle }}<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.75;color:rgba(247,244,239,.78)\">{{ modalBody }}<\u002Fp>\n          <div style=\"display:flex;align-items:baseline;gap:12px\">\n            <span style=\"font-family:'DCCAsh',serif;font-size:20px;color:rgba(247,244,239,.45);text-decoration:line-through\">{{ precoCheioTexto }}<\u002Fspan>\n            <span style=\"font-family:'DCCAsh',serif;font-size:36px;color:#F7F4EF\">{{ precoPrevendaTexto }}<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#F2891E\">{{ descontoTexto }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;line-height:1.7;color:rgba(247,244,239,.5)\">Você reserva agora e só é cobrado em {{ dataLonga }}, no dia da estreia.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ reservar }}\" style=\"height:52px;padding:0 26px;background:#F2891E;color:#0B0B0B;border:none;font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;cursor:pointer\">Reservar meu exemplar<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ fecharModal }}\" style=\"height:52px;padding:0 22px;background:transparent;color:rgba(247,244,239,.6);border:1px solid rgba(247,244,239,.25);font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;cursor:pointer\">Agora não<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;precoCheio&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:72,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;R$&quot;,&quot;min&quot;:10,&quot;max&quot;:300,&quot;step&quot;:1}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: \"assistente\", step: 1, publicado: false, detalheAberto: true,\n    launchDate: \"2026-10-14\", launchTime: \"19:00\",\n    presalePrice: 57.6, intervalo: 2,\n    modalTitle: \"little fish, big fish está em pré-venda\",\n    modalBody: \"Terceiro livro de poesia de Natália Nolli Sasso. Reserve agora com desconto — o exemplar sai na estreia.\",\n    modalAberto: true, reservou: false, ultimaVista: null\n  };\n\n  get fullPrice() { return this.props.precoCheio ?? 72; }\n\n  brl(v) { return \"R$ \" + v.toFixed(2).replace(\".\", \",\"); }\n\n  dias() {\n    const d = new Date(this.state.launchDate + \"T00:00:00\");\n    const diff = Math.ceil((d - new Date(\"2026-09-19T00:00:00\")) / 86400000);\n    return diff > 0 ? diff : 0;\n  }\n\n  dataLonga() {\n    const m = [\"janeiro\",\"fevereiro\",\"março\",\"abril\",\"maio\",\"junho\",\"julho\",\"agosto\",\"setembro\",\"outubro\",\"novembro\",\"dezembro\"];\n    const d = new Date(this.state.launchDate + \"T00:00:00\");\n    if (isNaN(d)) return \"—\";\n    return d.getDate() + \" de \" + m[d.getMonth()] + \" de \" + d.getFullYear();\n  }\n\n  dataCurta() {\n    const d = new Date(this.state.launchDate + \"T00:00:00\");\n    if (isNaN(d)) return \"—\";\n    return String(d.getDate()).padStart(2, \"0\") + \"/\" + String(d.getMonth() + 1).padStart(2, \"0\");\n  }\n\n  set(k, v) { this.setState({ [k]: v }); }\n\n  renderVals() {\n    const s = this.state, full = this.fullPrice, pre = Number(s.presalePrice) || 0;\n    const pct = full > 0 ? Math.round((1 - pre / full) * 100) : 0;\n    const labels = [\"Quando estreia\", \"Quanto custa\", \"Como aparece\", \"Revisar e publicar\"];\n    const hints = [this.dataLonga(), this.brl(pre) + \" · −\" + pct + \"%\", \"Aviso a cada \" + s.intervalo + \"h\", s.publicado ? \"No ar\" : \"Rascunho\"];\n    const intervaloTexto = s.intervalo + \"h\";\n\n    const trilha = labels.map((label, i) => {\n      const n = i + 1, ativo = n === s.step, feito = n < s.step;\n      return {\n        n: \"0\" + n, label, hint: (ativo || feito) ? hints[i] : \"\",\n        bg: ativo ? \"#F7F4EF\" : \"transparent\",\n        fg: ativo ? \"#0B0B0B\" : (feito ? \"#F7F4EF\" : \"rgba(247,244,239,.5)\"),\n        num: ativo ? \"#7A1E22\" : (feito ? \"#D8D0C4\" : \"rgba(247,244,239,.35)\"),\n        bar: (ativo || feito) ? \"#7A1E22\" : \"transparent\",\n        hintColor: ativo ? \"rgba(11,11,11,.6)\" : \"rgba(247,244,239,.55)\",\n        go: () => this.set(\"step\", n)\n      };\n    });\n\n    const atalhos = [10, 20, 25].map(p => {\n      const val = Math.round(full * (1 - p / 100) * 100) / 100;\n      const on = Math.abs(val - pre) < 0.005;\n      return { label: \"−\" + p + \"%\", bg: on ? \"#0B0B0B\" : \"#FFFFFF\", fg: on ? \"#F7F4EF\" : \"#0B0B0B\", go: () => this.set(\"presalePrice\", val) };\n    });\n\n    const intervalos = [1, 2, 6, 24].map(h => ({\n      label: h === 24 ? \"1 dia\" : h + \" horas\",\n      bg: h === s.intervalo ? \"#0B0B0B\" : \"#FFFFFF\",\n      fg: h === s.intervalo ? \"#F7F4EF\" : \"#0B0B0B\",\n      go: () => this.set(\"intervalo\", h)\n    }));\n\n    const tab = k => s.screen === k;\n    return {\n      isAssistente: tab(\"assistente\"), isLista: tab(\"lista\"), isLoja: tab(\"loja\"),\n      tabA: tab(\"assistente\") ? \"#F7F4EF\" : \"transparent\", tabAFg: tab(\"assistente\") ? \"#0B0B0B\" : \"#F7F4EF\",\n      tabB: tab(\"lista\") ? \"#F7F4EF\" : \"transparent\", tabBFg: tab(\"lista\") ? \"#0B0B0B\" : \"#F7F4EF\",\n      tabC: tab(\"loja\") ? \"#F7F4EF\" : \"transparent\", tabCFg: tab(\"loja\") ? \"#0B0B0B\" : \"#F7F4EF\",\n      goAssistente: () => this.setState({ screen: \"assistente\" }),\n      goLista: () => this.setState({ screen: \"lista\" }),\n      goLoja: () => this.setState({ screen: \"loja\" }),\n\n      trilha, atalhos, intervalos,\n      isStep1: s.step === 1, isStep2: s.step === 2, isStep3: s.step === 3, isStep4: s.step === 4,\n      stepLabel: labels[s.step - 1],\n      avancar: () => s.step < 4 ? this.set(\"step\", s.step + 1) : this.set(\"publicado\", true),\n      voltar: () => this.set(\"step\", Math.max(1, s.step - 1)),\n      avancarLabel: s.step < 4 ? \"Continuar\" : (s.publicado ? \"Publicado\" : \"Publicar pré-venda\"),\n      publicado: s.publicado,\n\n      launchDate: s.launchDate, launchTime: s.launchTime,\n      onDate: e => this.set(\"launchDate\", e.target.value),\n      onTime: e => this.set(\"launchTime\", e.target.value),\n      presalePrice: s.presalePrice,\n      onPrice: e => this.set(\"presalePrice\", Number(e.target.value)),\n      modalTitle: s.modalTitle, modalBody: s.modalBody,\n      onTitle: e => this.set(\"modalTitle\", e.target.value),\n      onBody: e => this.set(\"modalBody\", e.target.value),\n\n      precoCheioTexto: this.brl(full), precoPrevendaTexto: this.brl(pre),\n      descontoTexto: \"−\" + pct + \"%\", economiaTexto: this.brl(full - pre),\n      dataLonga: this.dataLonga(), dataCurta: this.dataCurta(), diasRestantes: this.dias(),\n      intervaloTexto, intervaloFrase: s.intervalo === 24 ? \"uma vez por dia\" : \"a cada \" + s.intervalo + \" horas\",\n      totalACobrar: this.brl(pre * 18),\n      resumoFrase: \"Quem reservar até \" + this.dataLonga() + \" leva little fish, big fish por \" + this.brl(pre) + \" em vez de \" + this.brl(full) + \" (−\" + pct + \"%), e só é cobrado no dia da estreia, às \" + s.launchTime + \".\",\n\n      previaTitulo: s.step >= 3 ? \"Prévia · aviso no site\" : \"Prévia · cartão na loja\",\n      previaCartao: s.step < 3, previaModal: s.step >= 3,\n\n      detalheAberto: s.detalheAberto,\n      toggleDetalhe: () => this.set(\"detalheAberto\", !s.detalheAberto),\n\n      modalAberto: s.modalAberto,\n      fecharModal: () => this.setState({ modalAberto: false, ultimaVista: \"agora\" }),\n      reservar: () => this.setState({ modalAberto: false, reservou: true, ultimaVista: \"agora\" }),\n      simularVisita: () => this.setState({ modalAberto: s.reservou ? false : s.ultimaVista === null }),\n      avancarTempo: () => this.setState({ modalAberto: !s.reservou, ultimaVista: null }),\n      estadoModal: s.reservou\n        ? \"Você já reservou — o aviso não aparece mais para este navegador.\"\n        : (s.modalAberto ? \"Aviso aberto. Fechar conta como visto.\" : (s.ultimaVista ? \"Visto agora. Recarregar não traz de volta antes de \" + intervaloTexto + \".\" : \"Nenhum aviso pendente.\"))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
