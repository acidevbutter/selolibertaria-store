<!-- @dsCard group="Components" viewport="700x400" name="Comércio · ProductCard, CartLine, OrderSummary" subtitle="Um cartão para toda categoria + linhas de carrinho e resumo" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}*{box-sizing:border-box}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .col{display:flex;flex-direction:column;gap:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:.24em;text-transform:uppercase}

</style></head><body>

<div style="display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start">
  <article style="display:flex;flex-direction:column;background:var(--sl-surface-card);border:1px solid var(--sl-line-hairline)">
    <div style="aspect-ratio:1/1;background:var(--sl-sand);overflow:hidden;position:relative">
      <img src="../../assets/img/lfbf-cover-full.png" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
      <span class="btn" style="position:absolute;top:0;left:0;height:24px;padding:0 9px;background:var(--sl-buy);color:var(--sl-text-on-ink);font-size:10px;letter-spacing:.2em">Pré-venda</span>
    </div>
    <div style="padding:16px;display:flex;flex-direction:column;gap:8px;flex:1">
      <span style="font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--sl-text-quiet)">Livro</span>
      <h3 style="margin:0;font-family:var(--sl-font-display);font-size:22px">little fish, big fish</h3>
      <div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-family:var(--sl-font-display);font-size:22px">R$ 72,00</span><span style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sl-accent)">Envio 12 set</span></div>
      <span class="btn" style="height:48px;background:var(--sl-ink);color:var(--sl-text-on-ink);font-size:11px">Adicionar</span>
    </div>
  </article>
  <div class="col" style="gap:16px">
    <div style="background:var(--sl-surface-band);padding:14px 20px;display:flex;flex-direction:column;gap:8px">
      <p style="margin:0;font-size:13px;font-weight:700">Faltam R$ 8,00 para o frete grátis <span style="font-weight:400;color:var(--sl-text-soft)">(acima de R$ 200,00)</span></p>
      <div style="height:8px;background:rgba(11,11,11,.16)"><div style="width:96%;height:8px;background:var(--sl-wine)"></div></div>
    </div>
    <div style="padding:16px 0;border-top:1px solid var(--sl-line-hairline);border-bottom:1px solid var(--sl-line-hairline);display:flex;gap:14px">
      <div style="width:64px;height:64px;background:var(--sl-sand);overflow:hidden;flex:none"><img src="../../assets/img/illustration-mermaid-circle.png" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <p style="margin:0;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sl-text-quiet)">Objeto · serigrafia</p>
        <p style="margin:0;font-family:var(--sl-font-display);font-size:18px">Pôster Ninfas</p>
        <div style="display:flex;align-items:center;justify-content:space-between"><div style="height:44px;border:1px solid var(--sl-line-strong);display:flex;align-items:center;gap:14px;padding:0 12px;font-size:15px"><span>−</span><span>1</span><span>+</span></div><span style="font-family:var(--sl-font-display);font-size:18px">R$ 90,00</span></div>
      </div>
    </div>
    <div class="col" style="gap:8px;font-size:15px">
      <div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>R$ 192,00</span></div>
      <div style="display:flex;justify-content:space-between"><span>Frete · PAC</span><span>R$ 21,90</span></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--sl-line-hairline);padding-top:10px"><span style="font-weight:700">Total</span><span style="font-family:var(--sl-font-display);font-size:28px">R$ 213,90</span></div>
      <p style="margin:0;font-size:12px;color:var(--sl-text-soft)">Valor final. Não há taxas adicionais na próxima etapa.</p>
    </div>
  </div>
</div>
</body></html>
