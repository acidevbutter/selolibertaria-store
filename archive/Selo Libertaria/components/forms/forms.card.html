<!-- @dsCard group="Components" viewport="700x290" name="Formulário · Field, QuantityStepper" subtitle="Campo de 52px em repouso, foco e erro" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}*{box-sizing:border-box}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .col{display:flex;flex-direction:column;gap:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:.24em;text-transform:uppercase}

</style></head><body>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
  <div class="col"><span class="lbl">Rótulo</span>
    <div style="height:52px;border:1px solid var(--sl-line-strong);background:var(--sl-surface-card);display:flex;align-items:center;padding:0 14px;font-size:16px;color:var(--sl-text-disabled)">Placeholder</div></div>
  <div class="col"><span class="lbl">Foco</span>
    <div style="height:52px;border:1px solid var(--sl-ink);box-shadow:var(--sl-focus-ring);background:var(--sl-surface-card);display:flex;align-items:center;padding:0 14px;font-size:16px">01310-000</div></div>
  <div class="col" style="grid-column:span 2"><span class="lbl" style="color:var(--sl-danger)">Erro com ação</span>
    <div style="height:52px;border:1px solid var(--sl-danger);background:var(--sl-danger-wash);display:flex;align-items:center;padding:0 14px;font-size:16px;color:var(--sl-danger)">CEP não encontrado</div>
    <p style="margin:0;font-size:13px;color:var(--sl-danger)">Confira o número ou informe o endereço manualmente.</p></div>
  <div class="col"><span class="lbl">Com sufixo</span>
    <div style="height:52px;border:1px solid var(--sl-line-strong);background:var(--sl-surface-card);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:16px"><span>4111 1111 1111 1111</span><span style="font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--sl-accent)">VISA</span></div></div>
  <div class="col"><span class="lbl">QuantityStepper</span>
    <div style="display:flex;gap:10px">
      <div style="height:44px;min-width:104px;border:1px solid var(--sl-line-strong);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:15px"><span>−</span><span>1</span><span>+</span></div>
      <div style="height:52px;min-width:104px;border:1px solid var(--sl-line-strong);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:16px"><span>−</span><span>2</span><span>+</span></div>
    </div></div>
</div>
</body></html>
