<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}*{box-sizing:border-box}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .col{display:flex;flex-direction:column;gap:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:.24em;text-transform:uppercase}

</style></head><body>

<div class="col" style="gap:16px">
  <div style="background:var(--sl-ink);color:var(--sl-text-on-ink);padding:24px;display:grid;grid-template-columns:1fr 140px;gap:20px;align-items:center">
    <div class="col" style="gap:12px">
      <p style="margin:0;font-size:10px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:var(--sl-text-on-ink-label)">Lançamento</p>
      <h1 style="margin:0;font-family:var(--sl-font-head);font-size:44px;line-height:.9;font-weight:900;letter-spacing:-.055em;text-transform:uppercase">little fish, big fish</h1>
      <p style="margin:0;font-size:14px;line-height:1.7;color:var(--sl-text-on-ink-muted);max-width:44ch">Natália Nolli Sasso mergulha onde sons e luzes chegam dispersos.</p>
      <div style="display:flex;gap:10px">
        <span class="btn" style="height:48px;padding:0 22px;background:var(--sl-buy);color:var(--sl-text-on-ink);font-size:11px">Comprar agora</span>
        <span class="btn" style="height:48px;padding:0 18px;border:1px solid var(--sl-line-on-ink-hi);color:var(--sl-text-on-ink);font-size:11px">Ler trecho</span>
      </div>
    </div>
    <div style="aspect-ratio:1/1;background:var(--sl-charcoal);overflow:hidden"><img src="../../assets/img/lfbf-cover-full.png" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>
  </div>
  <div style="display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--sl-line-hairline);padding-bottom:14px">
    <h2 style="margin:0;font-family:var(--sl-font-head);font-size:44px;font-weight:900;letter-spacing:-.05em;text-transform:uppercase">Em destaque</h2>
    <span class="btn" style="height:48px;padding:0 20px;border:1px solid var(--sl-ink);font-size:11px">Ver a loja completa</span>
  </div>
</div>
</body></html>
