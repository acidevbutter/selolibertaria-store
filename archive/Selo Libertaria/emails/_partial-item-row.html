<tr>
<td width="72" valign="top" style="padding:0 16px 18px 0;">
<img src="{item_image_url}" width="72" height="72" alt="" style="display:block;border:0;outline:none;width:72px;height:72px;background-color:#D8D0C4;">
</td>
<td valign="top" style="padding:0 0 18px 0;border-bottom:1px solid rgba(247,244,239,.14);font-family:'Iowan Old Style',Georgia,'Times New Roman',serif;">
<div style="font-size:11px;line-height:1.4;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(247,244,239,.60);">{item_category}</div>
<div style="height:7px;line-height:7px;font-size:7px;">&nbsp;</div>
<div style="font-size:17px;line-height:1.3;color:#F7F4EF;">{item_title}</div>
<div style="height:5px;line-height:5px;font-size:5px;">&nbsp;</div>
<div style="font-size:13px;line-height:1.6;color:rgba(247,244,239,.72);">{item_variant} · qtd {item_quantity}</div>
</td>
<td width="96" align="right" valign="top" style="padding:0 0 18px 0;border-bottom:1px solid rgba(247,244,239,.14);font-family:'Iowan Old Style',Georgia,'Times New Roman',serif;font-size:17px;line-height:1.3;color:#F7F4EF;">{item_price}</td>
</tr>
