<!-- @dsCard group="Blocos" viewport="700x180" name="Formas da imagem" subtitle="Quatro formas nomeadas; nunca largura em pixel nem canto arrastável" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}*{box-sizing:border-box}
  body{background:var(--ad-desk);color:var(--ad-text);font-family:var(--ad-font-body);padding:18px}
  .mono{font-family:var(--ad-font-mono)}
  .ml{font-size:var(--ad-size-micro);font-weight:900;letter-spacing:var(--ad-track-label);text-transform:uppercase;color:var(--ad-text-label)}
  .eb{margin:0;font-family:var(--ad-font-mono);font-size:var(--ad-size-mono-label);letter-spacing:var(--ad-track-mono);text-transform:uppercase;color:var(--ad-wine)}
  .sw{display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:8px;gap:2px}
  .sw b{font-family:var(--ad-font-mono);font-size:11px;font-weight:400}
  .sw i{font-size:11px;font-style:normal;opacity:.72}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .badge{height:var(--ad-h-badge);display:inline-flex;align-items:center;padding:0 10px;font-family:var(--ad-font-mono);font-size:var(--ad-size-micro);letter-spacing:var(--ad-track-badge);text-transform:uppercase}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:var(--ad-track-button);text-transform:uppercase;font-size:12px}
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:86px;background:var(--ad-paper);border:1px solid var(--ad-line-sheet);padding:8px;display:flex;flex-direction:column;gap:5px"><div style="height:44px;background:repeating-linear-gradient(135deg,#D8D0C4 0 6px,#E4DED4 6px 12px)"></div><div style="height:4px;background:rgba(11,11,11,.22)"></div><div style="height:4px;width:80%;background:rgba(11,11,11,.22)"></div></div><span class="mono" style="font-size:11px;color:var(--ad-text-quiet)">wide · faixa larga</span></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:86px;background:var(--ad-paper);border:1px solid var(--ad-line-sheet);padding:8px;display:flex;gap:8px"><div style="width:44%;background:repeating-linear-gradient(135deg,#D8D0C4 0 6px,#E4DED4 6px 12px)"></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:5px"><div style="height:4px;background:rgba(11,11,11,.22)"></div><div style="height:4px;width:90%;background:rgba(11,11,11,.22)"></div><div style="height:4px;width:72%;background:rgba(11,11,11,.22)"></div></div></div><span class="mono" style="font-size:11px;color:var(--ad-text-quiet)">side · ao lado</span></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:86px;background:var(--ad-paper);border:1px solid var(--ad-line-sheet);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="height:52px;width:58%;background:repeating-linear-gradient(135deg,#D8D0C4 0 6px,#E4DED4 6px 12px)"></div><div style="height:4px;width:40%;background:rgba(11,11,11,.22)"></div></div><span class="mono" style="font-size:11px;color:var(--ad-text-quiet)">center · centralizada</span></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:86px;background:var(--ad-paper);border:1px solid var(--ad-line-sheet);padding:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:5px"><div style="background:repeating-linear-gradient(135deg,#D8D0C4 0 6px,#E4DED4 6px 12px)"></div><div style="background:repeating-linear-gradient(135deg,#D8D0C4 0 6px,#E4DED4 6px 12px)"></div><div style="background:repeating-linear-gradient(135deg,#D8D0C4 0 6px,#E4DED4 6px 12px)"></div><div style="background:repeating-linear-gradient(135deg,#D8D0C4 0 6px,#E4DED4 6px 12px)"></div><div style="background:repeating-linear-gradient(135deg,#D8D0C4 0 6px,#E4DED4 6px 12px)"></div><div style="background:repeating-linear-gradient(135deg,#D8D0C4 0 6px,#E4DED4 6px 12px)"></div></div><span class="mono" style="font-size:11px;color:var(--ad-text-quiet)">gallery · 3 a 6 fotos</span></div>
</div>
</body></html>
