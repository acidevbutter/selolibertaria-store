<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px;box-sizing:border-box}
  *{box-sizing:border-box}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}

</style></head><body>
<div class="row" style="gap:16px;align-items:center">
  <div style="width:120px;height:56px;background:var(--sl-ink)"></div>
  <div style="width:120px;height:56px;border:1px solid var(--sl-ink)"></div>
  <div style="width:56px;height:56px;background:var(--sl-sand)"></div>
  <p style="margin:0;max-width:34ch;font-size:12px;line-height:1.6;color:var(--sl-text-muted)">Nada arredonda: botão, campo, cartão, imagem, badge, avatar. O canto reto é a assinatura do selo — <code>rounded</code> herdado é bug.</p>
</div>
</body></html>
