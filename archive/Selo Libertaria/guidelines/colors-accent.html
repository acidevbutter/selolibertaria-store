<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px;box-sizing:border-box}
  *{box-sizing:border-box}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}

</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
  <div class="col">
    <div style="height:64px;background:var(--sl-wine)"></div>
    <span style="font-size:13px;font-weight:700">Vinho · #7A1E22</span>
    <span style="font-size:12px;line-height:1.5;color:var(--sl-text-muted)">Links, ✓, estado de estoque, erro, cupom, carrinho no header. É a voz do selo.</span>
  </div>
  <div class="col">
    <div style="height:64px;background:var(--sl-red)"></div>
    <span style="font-size:13px;font-weight:700">Vermelho · #B3282E</span>
    <span style="font-size:12px;line-height:1.5;color:var(--sl-text-muted)">Só compra: botão de 56px, badge de lançamento/pré-venda, item ativo da nav. Um por tela.</span>
  </div>
</div>
</body></html>
