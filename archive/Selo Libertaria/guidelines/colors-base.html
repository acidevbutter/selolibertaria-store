<!-- @dsCard group="Colors" viewport="700x180" name="Base" subtitle="Papel, preto, bege, carvão — as quatro superfícies" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px;box-sizing:border-box}
  *{box-sizing:border-box}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}

</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">

<div class="col" style="gap:6px">
  <div style="height:56px;background:var(--sl-paper);border:1px solid var(--sl-line)"></div>
  <span style="font-size:12px;font-weight:700">Papel</span>
  <span style="font-size:11px;color:var(--sl-text-soft)">#F7F4EF</span>
  <span style="font-size:10px;color:var(--sl-text-quiet)">fundo público padrão</span>
</div>

<div class="col" style="gap:6px">
  <div style="height:56px;background:var(--sl-ink);border:1px solid var(--sl-line)"></div>
  <span style="font-size:12px;font-weight:700">Preto</span>
  <span style="font-size:11px;color:var(--sl-text-soft)">#0B0B0B</span>
  <span style="font-size:10px;color:var(--sl-text-quiet)">hero, header, painel de compra</span>
</div>

<div class="col" style="gap:6px">
  <div style="height:56px;background:var(--sl-sand);border:1px solid var(--sl-line)"></div>
  <span style="font-size:12px;font-weight:700">Bege</span>
  <span style="font-size:11px;color:var(--sl-text-soft)">#D8D0C4</span>
  <span style="font-size:10px;color:var(--sl-text-quiet)">faixas de filtro e resumo</span>
</div>

<div class="col" style="gap:6px">
  <div style="height:56px;background:var(--sl-charcoal);border:1px solid var(--sl-line)"></div>
  <span style="font-size:12px;font-weight:700">Carvão</span>
  <span style="font-size:11px;color:var(--sl-text-soft)">#141210</span>
  <span style="font-size:10px;color:var(--sl-text-quiet)">mesa de trabalho, fora do site</span>
</div>
</div>
</body></html>
