<!-- @dsCard group="Oficina" viewport="700x150" name="Filetes e lavagens" subtitle="Tinta transparente em quatro pesos; nenhum cinza de biblioteca" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}*{box-sizing:border-box}
  body{background:var(--ad-desk);color:var(--ad-text);font-family:var(--ad-font-body);padding:18px}
  .mono{font-family:var(--ad-font-mono)}
  .ml{font-size:var(--ad-size-micro);font-weight:900;letter-spacing:var(--ad-track-label);text-transform:uppercase;color:var(--ad-text-label)}
  .eb{margin:0;font-family:var(--ad-font-mono);font-size:var(--ad-size-mono-label);letter-spacing:var(--ad-track-mono);text-transform:uppercase;color:var(--ad-wine)}
  .sw{display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:8px;gap:2px}
  .sw b{font-family:var(--ad-font-mono);font-size:11px;font-weight:400}
  .sw i{font-size:11px;font-style:normal;opacity:.72}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .badge{height:var(--ad-h-badge);display:inline-flex;align-items:center;padding:0 10px;font-family:var(--ad-font-mono);font-size:var(--ad-size-micro);letter-spacing:var(--ad-track-badge);text-transform:uppercase}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:var(--ad-track-button);text-transform:uppercase;font-size:12px}
</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;gap:10px">
    <div style="flex:1;height:34px;background:var(--ad-sheet);border:1px solid var(--ad-line-quiet)"></div>
    <div style="flex:1;height:34px;background:var(--ad-sheet);border:1px solid var(--ad-line-sheet)"></div>
    <div style="flex:1;height:34px;background:var(--ad-sheet);border:1px solid var(--ad-line)"></div>
    <div style="flex:1;height:34px;background:var(--ad-sheet);border:1px solid var(--ad-line-strong)"></div>
    <div style="flex:1;height:34px;background:var(--ad-wine-wash);border:1px solid var(--ad-wine-line)"></div>
  </div>
  <div style="display:flex;gap:10px" class="mono">
    <span style="flex:1;font-size:11px;color:var(--ad-text-quiet)">.08 divisor de linha</span>
    <span style="flex:1;font-size:11px;color:var(--ad-text-quiet)">.12 folha</span>
    <span style="flex:1;font-size:11px;color:var(--ad-text-quiet)">.20 painel</span>
    <span style="flex:1;font-size:11px;color:var(--ad-text-quiet)">.30 campo e botão</span>
    <span style="flex:1;font-size:11px;color:var(--ad-wine)">vinho .40 sobre lavagem .07</span>
  </div>
</div>
</body></html>
