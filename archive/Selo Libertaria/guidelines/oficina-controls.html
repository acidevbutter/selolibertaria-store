<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}*{box-sizing:border-box}
  body{background:var(--ad-desk);color:var(--ad-text);font-family:var(--ad-font-body);padding:18px}
  .mono{font-family:var(--ad-font-mono)}
  .ml{font-size:var(--ad-size-micro);font-weight:900;letter-spacing:var(--ad-track-label);text-transform:uppercase;color:var(--ad-text-label)}
  .eb{margin:0;font-family:var(--ad-font-mono);font-size:var(--ad-size-mono-label);letter-spacing:var(--ad-track-mono);text-transform:uppercase;color:var(--ad-wine)}
  .sw{display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:8px;gap:2px}
  .sw b{font-family:var(--ad-font-mono);font-size:11px;font-weight:400}
  .sw i{font-size:11px;font-style:normal;opacity:.72}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .badge{height:var(--ad-h-badge);display:inline-flex;align-items:center;padding:0 10px;font-family:var(--ad-font-mono);font-size:var(--ad-size-micro);letter-spacing:var(--ad-track-badge);text-transform:uppercase}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:var(--ad-track-button);text-transform:uppercase;font-size:12px}
</style></head><body>
<div style="display:flex;flex-direction:column;gap:8px">
  <div style="display:flex;align-items:center;gap:12px"><span class="mono" style="flex:none;width:40px;font-size:12px;color:var(--ad-text-quiet)">56</span><span style="flex:1;height:56px;background:var(--ad-shell);color:var(--ad-on-shell);display:flex;align-items:center;padding:0 14px;font-size:13px">Topbar</span></div>
  <div style="display:flex;align-items:center;gap:12px"><span class="mono" style="flex:none;width:40px;font-size:12px;color:var(--ad-text-quiet)">48</span><span style="flex:1;height:48px;background:var(--ad-sheet);border:1px solid var(--ad-line);display:flex;align-items:center;padding:0 18px;font-size:15px">Linha de lista</span></div>
  <div style="display:flex;align-items:center;gap:12px"><span class="mono" style="flex:none;width:40px;font-size:12px;color:var(--ad-text-quiet)">44</span><span class="btn" style="flex:1;height:44px;background:var(--ad-wine);color:var(--ad-on-shell)">Publicar</span></div>
  <div style="display:flex;align-items:center;gap:12px"><span class="mono" style="flex:none;width:40px;font-size:12px;color:var(--ad-text-quiet)">36</span><span style="flex:1;height:36px;background:var(--ad-sand);display:flex;align-items:center;padding:0 12px;font-size:13px">Botão de barra de ferramentas</span></div>
  <div style="display:flex;align-items:center;gap:12px"><span class="mono" style="flex:none;width:40px;font-size:12px;color:var(--ad-text-quiet)">28</span><span class="mono" style="flex:1;height:28px;background:var(--ad-ink);color:var(--ad-on-shell);display:flex;align-items:center;padding:0 10px;font-size:11px">Barrinha do bloco</span></div>
  <div style="display:flex;align-items:center;gap:12px"><span class="mono" style="flex:none;width:40px;font-size:12px;color:var(--ad-text-quiet)">24</span><span class="badge" style="background:var(--ad-sand);color:var(--ad-wine)">Publicado</span></div>
</div>
</body></html>
