<!-- @dsCard group="Oficina" viewport="700x170" name="Hover, seleção e foco" subtitle="Transição 120ms linear; o único halo do sistema é o foco vinho" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}*{box-sizing:border-box}
  body{background:var(--ad-desk);color:var(--ad-text);font-family:var(--ad-font-body);padding:18px}
  .mono{font-family:var(--ad-font-mono)}
  .ml{font-size:var(--ad-size-micro);font-weight:900;letter-spacing:var(--ad-track-label);text-transform:uppercase;color:var(--ad-text-label)}
  .eb{margin:0;font-family:var(--ad-font-mono);font-size:var(--ad-size-mono-label);letter-spacing:var(--ad-track-mono);text-transform:uppercase;color:var(--ad-wine)}
  .sw{display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:8px;gap:2px}
  .sw b{font-family:var(--ad-font-mono);font-size:11px;font-weight:400}
  .sw i{font-size:11px;font-style:normal;opacity:.72}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .badge{height:var(--ad-h-badge);display:inline-flex;align-items:center;padding:0 10px;font-family:var(--ad-font-mono);font-size:var(--ad-size-micro);letter-spacing:var(--ad-track-badge);text-transform:uppercase}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:var(--ad-track-button);text-transform:uppercase;font-size:12px}
</style></head><body>
<div style="display:flex;gap:10px;align-items:stretch">
  <div style="flex:1;background:var(--ad-shell);padding:0;display:flex;flex-direction:column;justify-content:center">
    <div style="height:44px;display:flex;align-items:center;padding:0 18px;font-size:15px;color:var(--ad-on-shell-soft)">Pedidos</div>
    <div style="height:44px;display:flex;align-items:center;padding:0 18px;font-size:15px;background:var(--ad-shell-hover);color:var(--ad-on-shell)">Páginas <span class="mono" style="margin-left:auto;font-size:10px;letter-spacing:.2em;color:var(--ad-on-shell-quiet)">HOVER</span></div>
    <div style="height:44px;display:flex;align-items:center;padding:0 18px;font-size:15px;background:var(--ad-selected);color:var(--ad-on-shell);font-weight:900;letter-spacing:.04em;text-transform:uppercase">Eventos</div>
  </div>
  <div style="flex:1;background:var(--ad-sheet);border:1px solid var(--ad-line-sheet);padding:14px;display:flex;flex-direction:column;gap:10px">
    <div style="height:48px;border-bottom:1px solid var(--ad-line-quiet);display:flex;align-items:center;font-size:15px">Linha em repouso</div>
    <div style="height:48px;background:var(--ad-row-hover);border-bottom:1px solid var(--ad-line);display:flex;align-items:center;padding:0 10px;font-size:15px">Linha em hover</div>
    <div style="height:44px;background:var(--ad-sheet);border:1px solid var(--ad-ink);box-shadow:var(--ad-focus);display:flex;align-items:center;padding:0 14px;font-size:15px;color:var(--ad-text-muted)">Campo com foco</div>
  </div>
</div>
</body></html>
