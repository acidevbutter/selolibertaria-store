<!-- @dsCard group="Oficina" viewport="700x160" name="Três superfícies" subtitle="Casca de tinta, mesa de papel, folha branca — nada de quarta cor de fundo" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}*{box-sizing:border-box}
  body{background:var(--ad-desk);color:var(--ad-text);font-family:var(--ad-font-body);padding:18px}
  .mono{font-family:var(--ad-font-mono)}
  .ml{font-size:var(--ad-size-micro);font-weight:900;letter-spacing:var(--ad-track-label);text-transform:uppercase;color:var(--ad-text-label)}
  .eb{margin:0;font-family:var(--ad-font-mono);font-size:var(--ad-size-mono-label);letter-spacing:var(--ad-track-mono);text-transform:uppercase;color:var(--ad-wine)}
  .sw{display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:8px;gap:2px}
  .sw b{font-family:var(--ad-font-mono);font-size:11px;font-weight:400}
  .sw i{font-size:11px;font-style:normal;opacity:.72}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .badge{height:var(--ad-h-badge);display:inline-flex;align-items:center;padding:0 10px;font-family:var(--ad-font-mono);font-size:var(--ad-size-micro);letter-spacing:var(--ad-track-badge);text-transform:uppercase}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:var(--ad-track-button);text-transform:uppercase;font-size:12px}
</style></head><body>
<div style="display:flex;height:124px;border:1px solid var(--ad-line)">
  <div style="flex:none;width:180px;background:var(--ad-shell);color:var(--ad-on-shell);padding:12px;display:flex;flex-direction:column;justify-content:space-between">
    <span class="mono" style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ad-on-shell-label)">Casca</span>
    <span class="mono" style="font-size:11px">#0B0B0B · onde você navega</span>
  </div>
  <div style="flex:1;background:var(--ad-desk);padding:12px;display:flex;flex-direction:column;gap:8px">
    <span class="mono" style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ad-text-quiet)">Mesa · #EFEAE2</span>
    <div style="flex:1;background:var(--ad-sheet);border:1px solid var(--ad-line-sheet);padding:10px;display:flex;flex-direction:column;justify-content:space-between">
      <span class="eb">Folha · #FFFFFF</span>
      <span style="font-size:13px;color:var(--ad-text-muted)">onde você trabalha — o único branco do painel</span>
    </div>
  </div>
</div>
</body></html>
