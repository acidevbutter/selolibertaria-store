<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}*{box-sizing:border-box}
  body{background:var(--ad-desk);color:var(--ad-text);font-family:var(--ad-font-body);padding:18px}
  .mono{font-family:var(--ad-font-mono)}
  .ml{font-size:var(--ad-size-micro);font-weight:900;letter-spacing:var(--ad-track-label);text-transform:uppercase;color:var(--ad-text-label)}
  .eb{margin:0;font-family:var(--ad-font-mono);font-size:var(--ad-size-mono-label);letter-spacing:var(--ad-track-mono);text-transform:uppercase;color:var(--ad-wine)}
  .sw{display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:8px;gap:2px}
  .sw b{font-family:var(--ad-font-mono);font-size:11px;font-weight:400}
  .sw i{font-size:11px;font-style:normal;opacity:.72}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .badge{height:var(--ad-h-badge);display:inline-flex;align-items:center;padding:0 10px;font-family:var(--ad-font-mono);font-size:var(--ad-size-micro);letter-spacing:var(--ad-track-badge);text-transform:uppercase}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:var(--ad-track-button);text-transform:uppercase;font-size:12px}
</style></head><body>
<div style="display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;align-items:baseline;gap:16px"><span class="mono" style="flex:none;width:104px;font-size:11px;color:var(--ad-text-quiet)">36 / tela</span><span style="font-size:36px;font-weight:900;line-height:.92;letter-spacing:-.045em;text-transform:uppercase">Sarau Safado</span></div>
  <div style="display:flex;align-items:baseline;gap:16px"><span class="mono" style="flex:none;width:104px;font-size:11px;color:var(--ad-text-quiet)">24 / seção</span><span style="font-size:24px;font-weight:900;line-height:1;letter-spacing:-.03em;text-transform:uppercase">Blocos da página</span></div>
  <div style="display:flex;align-items:baseline;gap:16px"><span class="mono" style="flex:none;width:104px;font-size:11px;color:var(--ad-text-quiet)">15 / corpo</span><span style="font-size:15px;line-height:1.7;color:var(--ad-text-muted)">Rascunho salvo, só vai ao ar quando você publicar.</span></div>
  <div style="display:flex;align-items:baseline;gap:16px"><span class="mono" style="flex:none;width:104px;font-size:11px;color:var(--ad-text-quiet)">11 / micro</span><span class="ml" style="color:var(--ad-text)">Onde esta imagem aparece</span></div>
</div>
