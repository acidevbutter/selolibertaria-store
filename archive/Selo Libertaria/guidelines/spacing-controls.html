<!-- @dsCard group="Spacing" viewport="700x180" name="Alturas de controle" subtitle="56 compra · 52 campo · 48 padrão · 44 mínimo · 26 chip" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px;box-sizing:border-box}
  *{box-sizing:border-box}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}

</style></head><body>
<div class="row" style="align-items:flex-end;gap:14px">
  
  <div class="col" style="gap:6px;align-items:center">
    <div style="width:112px;height:56px;background:var(--sl-buy);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--sl-text-on-ink)">56px</div>
    <span style="font-size:10px;color:var(--sl-text-quiet)">buy</span>
  </div>
  <div class="col" style="gap:6px;align-items:center">
    <div style="width:112px;height:52px;border:1px solid var(--sl-line-strong);background:var(--sl-surface-card);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--sl-text-muted)">52px</div>
    <span style="font-size:10px;color:var(--sl-text-quiet)">field</span>
  </div>
  <div class="col" style="gap:6px;align-items:center">
    <div style="width:112px;height:48px;background:var(--sl-ink);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--sl-text-on-ink)">48px</div>
    <span style="font-size:10px;color:var(--sl-text-quiet)">button</span>
  </div>
  <div class="col" style="gap:6px;align-items:center">
    <div style="width:112px;height:44px;border:1px solid var(--sl-line-strong);background:var(--sl-surface-card);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--sl-text-muted)">44px</div>
    <span style="font-size:10px;color:var(--sl-text-quiet)">small</span>
  </div>
  <div class="col" style="gap:6px;align-items:center">
    <div style="width:112px;height:26px;border:1px solid var(--sl-line-strong);background:var(--sl-surface-card);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--sl-text-muted)">26px</div>
    <span style="font-size:10px;color:var(--sl-text-quiet)">chip</span>
  </div>
</div>
</body></html>
