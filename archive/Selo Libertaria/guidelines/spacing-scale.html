<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px;box-sizing:border-box}
  *{box-sizing:border-box}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}

</style></head><body>
<div class="row" style="align-items:flex-end;gap:10px">
  <div class="col" style="gap:6px;align-items:center"><div style="width:6px;height:6px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">6</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:8px;height:8px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">8</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:10px;height:10px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">10</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:12px;height:12px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">12</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:14px;height:14px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">14</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:16px;height:16px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">16</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:20px;height:20px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">20</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:24px;height:24px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">24</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:28px;height:28px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">28</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:32px;height:32px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">32</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:40px;height:40px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">40</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:48px;height:48px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">48</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:56px;height:56px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">56</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:64px;height:64px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">64</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:80px;height:80px;background:var(--sl-ink)"></div><span style="font-size:10px;color:var(--sl-text-quiet)">80</span></div>
</div>
</body></html>
