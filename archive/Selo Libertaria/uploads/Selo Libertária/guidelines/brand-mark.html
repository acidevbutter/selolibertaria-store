<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px;box-sizing:border-box}
  *{box-sizing:border-box}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}
body{background:var(--sl-ink)}
</style></head><body>
<div class="row" style="gap:32px">
  <div style="display:flex;align-items:center;gap:14px">
    <div style="width:40px;height:40px;overflow:hidden"><img src="../assets/img/selolibertaria.png" alt="Selo Libertária" style="width:100%;height:100%;object-fit:cover;display:block"></div>
    <div class="col" style="gap:0">
      <span style="font-size:10px;font-weight:900;letter-spacing:.34em;text-transform:uppercase;color:var(--sl-text-on-ink-label)">Selo</span>
      <span style="font-size:15px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:var(--sl-text-on-ink)">Libertária</span>
    </div>
  </div>
  <span style="font-size:13px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:var(--sl-text-on-ink)">Libertária</span>
  <span style="font-size:11px;color:var(--sl-text-on-ink-quiet);letter-spacing:0;text-transform:none;max-width:24ch">Mobile e checkout usam só "Libertária".</span>
</div>
</body></html>
