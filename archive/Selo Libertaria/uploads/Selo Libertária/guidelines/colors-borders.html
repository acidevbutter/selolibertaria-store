<!-- @dsCard group="Colors" viewport="700x170" name="Bordas e foco" subtitle="Quatro pesos de filete + o halo vinho" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px;box-sizing:border-box}
  *{box-sizing:border-box}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}

</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
  <div class="col" style="gap:6px"><div style="height:44px;border:1px solid var(--sl-line-hairline);background:var(--sl-surface-card)"></div><span style="font-size:11px;font-weight:700">14%</span><span style="font-size:10px;color:var(--sl-text-quiet)">divisória interna</span></div><div class="col" style="gap:6px"><div style="height:44px;border:1px solid var(--sl-line);background:var(--sl-surface-card)"></div><span style="font-size:11px;font-weight:700">20%</span><span style="font-size:10px;color:var(--sl-text-quiet)">moldura de cartão</span></div><div class="col" style="gap:6px"><div style="height:44px;border:1px solid var(--sl-line-strong);background:var(--sl-surface-card)"></div><span style="font-size:11px;font-weight:700">30%</span><span style="font-size:10px;color:var(--sl-text-quiet)">campo em repouso</span></div><div class="col" style="gap:6px"><div style="height:44px;border:1px solid var(--sl-line-solid);background:var(--sl-surface-card)"></div><span style="font-size:11px;font-weight:700">100%</span><span style="font-size:10px;color:var(--sl-text-quiet)">selecionado</span></div>
</div>
<div class="col" style="margin-top:16px;gap:6px">
  <span class="lbl">Foco</span>
  <div style="height:44px;border:1px solid var(--sl-line-solid);box-shadow:var(--sl-focus-ring);background:var(--sl-surface-card);display:flex;align-items:center;padding:0 14px;font-size:15px">01310-000</div>
</div>
</body></html>
