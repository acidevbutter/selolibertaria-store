<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px;box-sizing:border-box}
  *{box-sizing:border-box}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}
body{background:var(--sl-ink)}
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
  <div class="col" style="gap:4px"><p style="margin:0;font-size:17px;color:var(--sl-text-on-ink)">Aa</p><span style="font-size:11px;font-weight:700;color:var(--sl-text-on-ink)">100%</span><span style="font-size:10px;color:var(--sl-text-on-ink-quiet)">manchete</span></div><div class="col" style="gap:4px"><p style="margin:0;font-size:17px;color:var(--sl-text-on-ink-muted)">Aa</p><span style="font-size:11px;font-weight:700;color:var(--sl-text-on-ink)">82%</span><span style="font-size:10px;color:var(--sl-text-on-ink-quiet)">lead do hero</span></div><div class="col" style="gap:4px"><p style="margin:0;font-size:17px;color:var(--sl-text-on-ink-soft)">Aa</p><span style="font-size:11px;font-weight:700;color:var(--sl-text-on-ink)">72%</span><span style="font-size:10px;color:var(--sl-text-on-ink-quiet)">corpo secundário</span></div><div class="col" style="gap:4px"><p style="margin:0;font-size:17px;color:var(--sl-text-on-ink-label)">Aa</p><span style="font-size:11px;font-weight:700;color:var(--sl-text-on-ink)">60%</span><span style="font-size:10px;color:var(--sl-text-on-ink-quiet)">rótulo</span></div><div class="col" style="gap:4px"><p style="margin:0;font-size:17px;color:var(--sl-text-on-ink-quiet)">Aa</p><span style="font-size:11px;font-weight:700;color:var(--sl-text-on-ink)">45%</span><span style="font-size:10px;color:var(--sl-text-on-ink-quiet)">legenda de apoio</span></div>
</div>
</body></html>
