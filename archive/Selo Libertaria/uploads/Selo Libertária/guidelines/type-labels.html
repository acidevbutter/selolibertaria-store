<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--sl-paper);color:var(--sl-text);font-family:var(--sl-font-body);padding:20px;box-sizing:border-box}
  *{box-sizing:border-box}
  .lbl{font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}

</style></head><body>
<div class="col" style="gap:12px">
  <span style="font-size:11px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:var(--sl-text-quiet)">Manifesto</span>
  <span style="font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--sl-text-label)">Número do cartão</span>
  <span style="font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase">Adicionar</span>
  <span style="font-size:10px;font-weight:900;letter-spacing:.34em;text-transform:uppercase;color:var(--sl-text-quiet)">Selo</span>
  <span style="font-size:11px;color:var(--sl-text-soft);letter-spacing:0;text-transform:none">Quanto menor o corpo, maior o tracking. Nunca abaixo de 10px.</span>
</div>
</body></html>
