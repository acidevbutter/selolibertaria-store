services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: selolibertaria-frontend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3001}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3001"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    networks:
      - default
      - devbutter_shared

  mailpit:
    image: axllent/mailpit:latest
    container_name: relay-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      - MAILPIT_SMTP_LISTEN_ADDR=0.0.0.0:1025
      - MAILPIT_WEB_LISTEN_ADDR=0.0.0.0:8025

volumes:
  mongo_data:
    driver: local
  mailpit_data:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_next:
    driver: local

networks:
  devbutter_shared:
    name: devbutter_shared
    external: true
